<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Downloads</title>

    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./style.css">

    <style>
        iframe {
            height: 200px;
            width: 400px;
        }
    </style>
</head>

<body>
    <header></header>

    <p>
        <strong>games</strong> (which totally weren't ripped from <a href="https://itch.io/">itch.io</a>)
    </p>

    <details>
        <summary>Legal Disclaimer</summary>

        <pre>ALL GAMES LISTED ARE SUBJECT TO THEIR LICENSES AND RESTRICTIONS STATED ON THEIR OFFICIAL SITES</pre>
    </details>
</body>

<script src="./script.js"></script>
<script>
    const games = [
        {
            name: "PICOHOT",
            code: "https://html-classic.itch.zone/html/4274784/picohot_html/picohot.js",
            link: "https://tarkovsky.itch.io/picohot"
        },
        {
            name: "POOM",
            code: "https://html-classic.itch.zone/html/7204900/poom_1.9.js",
            link: "https://freds72.itch.io/poom"
        },
        {
            name: "CELESTE Classic",
            code: "https://html-classic.itch.zone/html/235259/Celeste/celeste.js",
            link: "https://maddymakesgamesinc.itch.io/celesteclassic"
        },
        {
            name: "Just One Boss",
            code: "https://html-classic.itch.zone/html/773027/just_one_boss.js",
            link: "https://aylanonsense.itch.io/just-one-boss"
        },
        {
            name: "Pico World Race",
            code: "https://html-classic.itch.zone/html/6362442/pwr.js",
            link: "https://pak-9.itch.io/pico-world-race"
        },
        {
            name: "Combo Pool",
            code: "https://html-classic.itch.zone/html/9331874/combopool.js",
            link: "https://nusan.itch.io/combo-pool"
        }
    ]

    games.forEach(game => {
        let name;
        const iframe = document.createElement("iframe");
        const a = document.createElement("a");

        Object.entries(game).forEach(([key, value]) => {
            switch (key) {
                case "name":
                    name = value;
                case "code":
                    iframe.scrolling = "no";
                    iframe.src = `./games/itch_loader.html?${value}`;
                case "link":
                    a.href = value;
                    a.innerHTML = ` ${name}`;
            }
        });
        const br = document.createElement("br");

        document.body.appendChild(br);
        document.body.appendChild(iframe);
        document.body.appendChild(a);
    });
</script>

</html>
