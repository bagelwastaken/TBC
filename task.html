<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task</title>

    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./style.css">

    <style>
        redact {
            color: lightgray;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>

<body>
    <header></header>

    <p>
        Welcome to our games.
    </p>

    <p>
        It appears no tasks are quite yet available. Please check back in later, a task should be available by <redact>
            [redacted]</redact>.
        In the meantime, you can <a href="join.html">join us</a>.
    </p>
</body>

<script src="./script.js"></script>
<script>
    const redactTags = document.getElementsByTagName("redact");

    const randomUnicode = n =>
        Array.from({ length: n }, () =>
            String.fromCodePoint(Math.floor(Math.random() * (0x30 - 0x7A + 1)) + 0x7A)
        ).join("");

    for (const tag of redactTags) {
        setInterval(() => {
            //tag.textContent = tag.textContent.split('').sort(function () { return 0.5 - Math.random() }).join('');
            tag.textContent = randomUnicode(tag.textContent.length);
        }, 50);
    }
</script>

</html>
